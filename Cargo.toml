[package]
name = "volna"
version = "0.1.0"
license = "GPL-3.0-only"
description = "Лёгкий нативный клиент Яндекс Музыки для Linux на GTK4 / Libadwaita и GStreamer"
repository = "https://github.com/fallkdm/volna"
edition = "2024"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_24"] }
libadwaita = { version = "0.9", features = ["v1_10"] }
glib = "0.22"
gio = "0.22"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
gstreamer = { version = "0.25", features = ["v1_28"] }
gstreamer-play = { version = "0.25", features = ["v1_28"] }
async-channel = "2"
mpris-server = { version = "0.10", features = ["tokio"] }
glow = "0.16"
libloading = "0.8"
gstreamer-app = "0.25"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
mdns-sd = "0.21.5"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
uuid = { version = "1.28.0", features = ["v4"] }
discord-rich-presence = "1.1.0"
